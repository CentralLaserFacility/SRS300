@writetimeout { disconnect; }
@replytimeout { disconnect; }
@readtimeout  { disconnect; }
@mismatch     { disconnect; }


ReplyTimeout = 2000;
ReadTimeout = 2000;
LockTimeout = 15000;
WriteTimeout = 100; #default
InTerminator = "\n";
OutTerminator = "\n";

getIDN {
    out "*IDN?";
    in "%\$1[^\r\n]";
    ExtraInput = Ignore;
}

cmd {
    out "\$1";
}

setD {
    out "\$1 %d";
}
getD {
    out "\$1?";
    in "%d";
    ExtraInput = Ignore;
}

getF {
    out "\$1?";
    in "%f";
    ExtraInput = Ignore;
}

#scans with waits for timeout reduction when using GPIB
scanD {
    wait 25;
    out "\$1?";
    in "%d";
    ExtraInput = Ignore;
}
scanF {
    wait 25;
    out "\$1?";
    in "%f";
    ExtraInput = Ignore;
}
hvOffOn {
    out "%{HVOF|HVON}";
}

setting {
    out "\$1 %f";
    @init { out "\$1?"; in "%f";}
}

